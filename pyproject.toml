[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apollo-jcf"
version = "0.1.0"
description = "AI3004: Architecting Autonomous Agents Project"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "chromadb>=1.3.0,<2",
  "docling>=2.64.0,<3",
  "docling-core>=2.106.0",
  "langchain>=1.3.14",
  "langchain-text-splitters>=1.0.0,<2",
  "langgraph>=1.2.22",
  "numpy>=1.26.0,<3",
  "pymupdf>=1.26.0,<2",
  "pypdf>=6.0.0,<7",
  "rapidocr-onnxruntime>=1.4.4,<2",
  "rich>=14.0.0,<15",
  "typer>=0.20.0,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0,<10",
  "ruff>=0.14.0,<1",
]

[project.scripts]
apollo = "apollo.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/apollo"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
